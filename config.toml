app_name = "Evidence Desk"

[logs]
log_file_fmt = "%(asctime)s | %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)d | %(message)s"
log_to_file = true
log_level = "INFO"
log_to_console = true
capturewarnings = true
rich_tracebacks = false

[exceptions]
default_error_message = "An unexpected error occured."

[model]
query_expansion_model = "qwen3:4b"
research_model = "qwen3:8b"
web_search_model= "qwen3:8b"
research_model_reasoning = true
query_expansion_reasoning = false
web_search_model_reasoning = true


